repositories:
  - name: 'bedag'
    url: 'https://bedag.github.io/helm-charts/' # Source - https://github.com/bedag/helm-charts/tree/master/charts/raw

releases:  
  - name: '{{ .Values.deployment.app_name }}-svc'
    chart: 'bedag/raw'
    version: '2.0.0'
    values:
      - resources:
        - apiVersion: v1
          kind: Service
          metadata:
            name: {{ .Values.deployment.app_name }}
            labels:
              app: {{ .Values.deployment.app_name }}
              version: {{ .Values.deployment.version }}
          spec:
            type: ClusterIP
            ports:
              - targetPort: default
                port: 80
                protocol: TCP
                name: default
            selector:
              app: {{ .Values.deployment.app_name }}

  - name: '{{ .Values.deployment.app_name }}-svc-act'
    chart: 'bedag/raw'
    version: '2.0.0'
    values:
    - resources:
      # This is where your provided snippet should go, with correct indentation
      - apiVersion: v1
        kind: ServiceAccount
        metadata:
          name: {{ .Values.deployment.app_name }}
          annotations:
            iam.gke.io/gcp-service-account: "{{ .Values.gsa.name }}@{{ .Values.gsa.project_id }}.iam.gserviceaccount.com"
          labels:
            app: {{ .Values.deployment.app_name }}

  - name: '{{ .Values.deployment.app_name }}-deploy'
    chart: 'bedag/raw'
    version: '2.0.0'
    values:
      - resources:
        - apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: {{ .Values.deployment.app_name }}
            # annotations:
            # #   reloader.stakater.com/auto: 'true' # Reload pods for any modification of a ConfigMap or Secret
            # # labels:
            #   app: {{ .Values.deployment.app_name }}
            #   version: {{ .Values.deployment.version }}
            #   tags.datadoghq.com/env: {{ .Values.deployment.namespace }}
            #   tags.datadoghq.com/service: {{ .Values.deployment.app_name }}
            #   tags.datadoghq.com/version: {{ .Values.deployment.version }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: {{ .Values.deployment.app_name }}
            strategy:
              rollingUpdate:
                maxSurge: {{ .Values.deployment.repo_values.deploy.rolling_update.max_surge }}
                maxUnavailable: {{ .Values.deployment.repo_values.deploy.rolling_update.max_unavailable }}
              type: RollingUpdate
            revisionHistoryLimit: 3
            template:
            #   metadata:
            #     name: {{ .Values.deployment.app_name }}
            #     labels:
            #       app: {{ .Values.deployment.app_name }}
            #       version: {{ .Values.deployment.version }}
            #       tags.datadoghq.com/env: {{ .Values.deployment.namespace }}
            #       tags.datadoghq.com/service: {{ .Values.deployment.app_name }}
            #       tags.datadoghq.com/version: {{ .Values.deployment.version }}
              spec:
                serviceAccountName: {{ .Values.deployment.app_name }}
                topologySpreadConstraints:
                  - maxSkew: 1
                    topologyKey: topology.kubernetes.io/zone
                    whenUnsatisfiable: DoNotSchedule
                    labelSelector:
                      matchLabels:
                        app: {{ .Values.deployment.app_name }}
                        version: {{ .Values.deployment.version }}
                terminationGracePeriodSeconds: 60 # Ensure the queue processor has time to detect the termination of the pod and properly stop processing
                containers:
                  - name: {{ .Values.deployment.app_name }}
                    image: '{{ env "IMAGE_NAME" }}:{{ env "IMAGE_TAG" }}'
                    imagePullPolicy: IfNotPresent
                    lifecycle:
                      preStop:
                        exec:
                          command: 
                            - /bin/bash
                            - -c
                            - touch "$K8S_TERMINATION_FILE" && sleep 120 # Let the health check know the container is shutting down
                    envFrom:
                      - secretRef:
                          name: {{ .Values.deployment.app_name }}
                    env:
                      - name: K8S_TERMINATION_FILE
                        value: "/app/www/k8s_termination.txt"
                      - name: APP_NAME
                        value: {{ .Values.deployment.app_name }}
                      - name: APP_VERSION
                        value: {{ .Values.deployment.version }}
                      - name: DD_LOGS_INJECTION
                        value: 'true'
                      - name: DD_PROFILING_ENABLED
                        value: 'false'
                      - name: DD_RUNTIME_METRICS_ENABLED
                        value: 'true'
                      - name: DD_TRACE_AGENT_URL
                        value: 'unix:///var/run/datadog/apm.socket'
                      - name: DD_ENV
                        value: {{ .Values.deployment.namespace }}
                      - name: DD_TRACE_AGENT_HOSTNAME
                        valueFrom:
                          fieldRef:
                            fieldPath: status.hostIP
                      - name: RAILS_MIN_THREADS
                        value: "1"
                      - name: RAILS_MAX_THREADS
                        value: "1"
                    ports:
                      - name: default
                        containerPort: 3000
                        protocol: TCP
                    livenessProbe:
                      httpGet:
                        path: /health_check
                        port: default
                        scheme: HTTP
                      periodSeconds: 16
                      initialDelaySeconds: 10
                      timeoutSeconds: 15
                      successThreshold: 1
                      failureThreshold: 6
                    startupProbe:
                      httpGet:
                        path: /health_check
                        port: default
                        scheme: HTTP
                      periodSeconds: 4
                      initialDelaySeconds: 10
                      timeoutSeconds: 3
                      successThreshold: 1
                      failureThreshold: 20
                    resources:
                      requests:
                        cpu: {{ .Values.deployment.repo_values.resources.requests.cpu }}
                        memory: {{ .Values.deployment.repo_values.resources.requests.memory }}
                      limits:
                        cpu: {{ .Values.deployment.repo_values.resources.limits.cpu }}
                        memory: {{ .Values.deployment.repo_values.resources.limits.memory }}
                    volumeMounts:
                      - name: apm-socket
                        mountPath: /var/run/datadog
                volumes:
                  - name: apm-socket
                    hostPath:
                      path: /var/run/datadog/

