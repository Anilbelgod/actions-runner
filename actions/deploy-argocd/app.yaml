# In your helmfile.yaml-like file (the one that uses {{ .Values }} templating)

repositories:
  # Cloud Posse incubator repo of helm charts
  - name: "cloudposse-incubator"
    url: "https://charts.cloudposse.com/incubator/"
  - name: 'bedag'
    url: 'https://bedag.github.io/helm-charts/'

releases:
  # This uses the 'app_name' set directly by yq (from inputs.app-name)
  - name: '{{ .Values.deployment.app_name }}'
    chart: "cloudposse-incubator/monochart"
    version: "0.26.0"
    wait: true
    force: true
    values:
      # These values now come from .Values.deployment.repo_values.<key>
      # Accessing the key changed from 'appName' to 'app_name'
      - fullnameOverride: '{{ .Values.deployment.repo_values.deployment.app_name }}' # <-- CHANGE HERE
        nameOverride: '{{ .Values.deployment.repo_values.deployment.app_name }}'     # <-- CHANGE HERE

        image:
          repository: '{{ .Values.deployment.repo_values.image.repository }}'
          tag: '{{ .Values.deployment.repo_values.image.tag }}'
          pullPolicy: Always

        replicaCount: {{ .Values.deployment.repo_values.replicaCount }}

        envFrom:
        - secretRef:
            name: '{{ .Values.deployment.app_name }}-secrets' # Keep consistent with this app_name

        service:
          enabled: true
          type: ClusterIP
          ports:
            default:
              internal: 8080
              external: 80

        # ... (probes, resources, ingress as they were, adjusted to repo_values. only if they are coming from the inputs.helm-values-file) ...
        # Example for ingress:
        # ingress:
        #   host: '{{ .Values.deployment.repo_values.ingress.host }}'
        #   enabled: true


  - name: '{{ .Values.deployment.app_name }}-secrets' # Consistent with first release name
    chart: 'bedag/raw'
    version: '2.0.0'
    values:
      - resources:
        - apiVersion: external-secrets.io/v1
          kind: ExternalSecret
          metadata:
            name: {{ .Values.deployment.app_name }} # Consistent secret name
          spec:
            refreshInterval: 60s
            secretStoreRef:
              name: gcp-secret-manager-store
              kind: SecretStore
            target:
              name: {{ .Values.deployment.app_name }} # Consistent secret target name
              creationPolicy: Owner
            data:
            {{ $service_secret_sm_path := .Values.deployment.service_secret_sm_path }}
            {{ range $i, $envar_key := .Values.deployment.envar_keys }}
              - secretKey: {{ $envar_key }}
                remoteRef:
                  key: {{ $service_secret_sm_path }}-{{ $envar_key }}
            {{ end }}