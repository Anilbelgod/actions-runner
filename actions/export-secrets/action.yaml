name: "Export secrets from GCP Secrets Manager" 

description: "Export secrets from GCP Secrets Manager to temporary secrets file" 

inputs:
  service-secret-sm-path:
    description: "The path to the service secret in GCP Secrets Manager"
    required: true 
  vault-env-keys:
    description: "The environment variable keys to be used for the vault secrets"
    required: true 
  secrets-file:
    description: "The path to the secrets file in the repository"
    required: true

runs:
  using: "composite"
  steps:

    - name: Make file executable
      run: chmod +x ${{ github.action_path }}/main.sh
      shell: bash

    - name: Run main script
      shell: bash
      run: | 
       ${{ github.action_path }}/main.sh ${{ inputs.service-secret-sm-path }} ${{ inputs.vault-env-keys }} ${{ inputs.secrets-file }}