name: 'Setup Atmos Environment'
description: 'Sets up GCloud, Terraform, Helm, Node.js, and Atmos'
runs:
  using: "composite"
  steps:
    - name: Checkout code
      uses: actions/checkout@v3
      
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2

    - name: Setup Helm
      uses: azure/setup-helm@v4.1.0
      with:
        version: "3.14.2"

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Setup Atmos
      uses: cloudposse/github-action-setup-atmos@v2
      with:
        atmos-version: 1.179.0
        install-wrapper: false